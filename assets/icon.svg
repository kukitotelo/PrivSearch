<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="500" height="500" x="6" y="6" rx="94" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Shield -->
  <path d="M 256,90 L 390,140 C 390,270 325,370 256,410 C 187,370 122,270 122,140 Z" 
        fill="url(#shieldGrad)" opacity="0.95"/>
  <path d="M 256,105 L 375,150 C 375,260 318,352 256,390 C 194,352 137,260 137,150 Z" 
        fill="none" stroke="#60a5fa" stroke-width="6"/>

  <!-- Magnifying Glass Inside Shield -->
  <circle cx="236" cy="226" r="54" fill="none" stroke="#ffffff" stroke-width="18"/>
  <line x1="276" y1="266" x2="330" y2="320" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>

  <!-- Lock indicator inside glass -->
  <rect x="220" y="215" width="32" height="26" rx="4" fill="url(#accent)"/>
  <path d="M 226,215 L 226,205 C 226,198 246,198 246,205 L 246,215" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
</svg>
