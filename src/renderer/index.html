<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivSearch</title>
  <style>
    :root {
      --bg-dark: #12151c;
      --bg-bar: #1c212c;
      --border-color: #2b3345;
      --text-main: #e1e7f0;
      --text-dim: #8b9bb4;
      --accent: #3b82f6;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --accent-red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top Bar */
    #top-bar {
      height: 80px;
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 4px 10px;
      gap: 4px;
      user-select: none;
    }

    /* Tab row */
    .tab-row {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 30px;
    }
    .tab {
      background: #181d26;
      padding: 4px 12px;
      border-radius: 6px 6px 0 0;
      border: 1px solid var(--border-color);
      border-bottom: none;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab.active {
      background: var(--bg-bar);
      font-weight: bold;
      border-color: var(--accent);
    }
    .btn-new-tab {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      border-radius: 4px;
      width: 24px;
      height: 24px;
      cursor: pointer;
    }

    /* Navigation row */
    .nav-row {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 38px;
    }
    .nav-btn {
      background: #252c3b;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn:hover { background: #2f384a; }

    .url-input-container {
      flex: 1;
      display: flex;
      align-items: center;
      background: #131722;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0 10px;
      height: 34px;
    }
    .url-input-container:focus-within {
      border-color: var(--accent);
    }
    #address-bar {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 13px;
    }

    /* Privacy indicator badge */
    .privacy-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #15221d;
      border: 1px solid #1c4b37;
      border-radius: 6px;
      font-size: 11px;
      color: var(--accent-green);
      white-space: nowrap;
    }
    .status-pill {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #232b3b;
      color: var(--text-dim);
    }

    /* Overlay for Search Results when in Search Mode */
    #search-results-overlay {
      display: none;
      position: absolute;
      top: 80px;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-dark);
      overflow-y: auto;
      padding: 24px;
      z-index: 100;
    }
    .result-section {
      background: #1a202c;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 20px;
      padding: 16px;
    }
    .section-title {
      font-size: 14px;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }
    .record-item {
      font-size: 12px;
      padding: 6px 0;
      border-bottom: 1px solid #283142;
      display: flex;
      justify-content: space-between;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="top-bar">
    <div class="tab-row" id="tab-row">
      <div class="tab active" id="tab-primary">
        <span>Cargando pestaña...</span>
      </div>
      <button class="btn-new-tab" id="btn-new-tab" title="Nueva pestaña">+</button>
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="btn-back" title="Atrás">←</button>
      <button class="nav-btn" id="btn-forward" title="Adelante">→</button>
      <button class="nav-btn" id="btn-reload" title="Recargar">↻</button>
      <div class="url-input-container">
        <input type="text" id="address-bar" placeholder="Ingresa URL, dominio, IP o dork (ej. domain:example.com port:443)..." autocomplete="off" />
      </div>
      <div class="privacy-badge" id="privacy-status-badge">
        <span>🔒 PRIVATE</span>
        <span class="status-pill" id="route-indicator">DIRECT</span>
        <span class="status-pill" id="session-indicator">TEMPORARY</span>
        <span class="status-pill" id="dns-indicator">DNS: NOT_TESTED</span>
      </div>
    </div>
  </div>

  <div id="search-results-overlay">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 id="search-query-display">Resultados de búsqueda</h2>
      <button id="btn-close-search" style="padding: 6px 12px; background: #2b3345; color: white; border: none; border-radius: 4px; cursor: pointer;">Volver al navegador</button>
    </div>
    <div id="results-container"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
